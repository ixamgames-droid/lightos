name: Windows-Setup

# XPLAT-47: baut LightOS-Setup.exe (PyInstaller onedir + Inno Setup) und legt
# es als Workflow-Artefakt ab. Bewusst KEIN Release-Publish: ob und wann ein
# Setup veroeffentlicht wird, entscheidet der Projektinhaber.
#
# Ablauf: Abhaengigkeiten -> Demo-Shows erzeugen (DEMO-8,
# packaging/demo_shows.py) -> PyInstaller (packaging/windows/LightOS.spec) ->
# Rauchtest der gepackten exe (--selbsttest: Importe inkl. QtWebEngine und die
# mitgelieferten Dateien, ohne Fenster) -> Inno Setup -> stilles Installieren
# nach "Programme" -> Rauchtest der INSTALLIERTEN exe -> Deinstallieren ->
# Artefakt.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Zusaetzlich bei jedem Push (jeder Zweig), der die Paketierung selbst
    # aendert — sonst faellt eine kaputte Spec erst beim naechsten Tag auf.
    # (Pfadfilter gelten fuer Zweig-Pushes; Tag-Pushes laufen immer.)
    branches: ["**"]
    paths:
      - "packaging/**"
      - "src/core/demo_shows.py"
      - ".github/workflows/windows-setup.yml"
      - "src/core/selbsttest.py"

permissions:
  contents: read

jobs:
  setup:
    name: LightOS-Setup.exe bauen
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 (x64) einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Abhaengigkeiten + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10"

      # Version aus dem Repo: APP_VERSION in main.py ist die einzige Quelle.
      - name: Version ermitteln
        id: version
        shell: pwsh
        run: |
          $v = python -c "import re,io; t=io.open('main.py',encoding='utf-8').read(); print(re.search(r'^APP_VERSION\s*=\s*[\x22\x27]([^\x22\x27]+)', t, re.M).group(1))"
          if (-not $v) { throw "APP_VERSION nicht gefunden" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "LightOS-Version: $v"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Host "::warning::Tag $env:GITHUB_REF_NAME passt nicht zu APP_VERSION $v"
          }

      # DEMO-8: die Demo-Shows sind nicht eingecheckt, sie entstehen hier aus
      # den Generatoren (Sandbox-Datenordner, Show-Lint --strict, unter einer
      # Minute) und landen in demo_shows/ — bundle_inhalt.py nimmt sie mit, der
      # Selbsttest der gepackten exe verlangt sie.
      - name: Demo-Shows erzeugen
        shell: pwsh
        run: |
          python packaging/demo_shows.py
          if ($LASTEXITCODE -ne 0) { throw "Demo-Shows: Exit-Code $LASTEXITCODE" }
          Get-ChildItem demo_shows | Format-Table Name, Length

      - name: PyInstaller-Build (onedir)
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean packaging/windows/LightOS.spec

      # LightOS.exe ist eine Fenster-App (console=False): stdout gibt es nicht,
      # der Bericht geht deshalb in eine Datei; der Exit-Code entscheidet.
      - name: Rauchtest gepackte exe (--selbsttest)
        shell: pwsh
        run: |
          $bericht = Join-Path $env:RUNNER_TEMP "selbsttest_dist.txt"
          $p = Start-Process -FilePath "dist\LightOS\LightOS.exe" -ArgumentList "--selbsttest", "`"$bericht`"" -Wait -PassThru
          if (Test-Path $bericht) { Get-Content $bericht } else { Write-Host "kein Bericht geschrieben" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest der gepackten exe: Exit-Code $($p.ExitCode)" }

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\LightOS.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: Exit-Code $LASTEXITCODE" }
          Get-Item dist\setup\LightOS-Setup.exe | Format-List Name, Length

      # Ende-zu-Ende: installieren wie ein Nutzer (nach "Programme"), die
      # INSTALLIERTE exe pruefen, wieder deinstallieren.
      - name: Rauchtest installiertes Setup
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "setup_install.log"
          $p = Start-Process -FilePath "dist\setup\LightOS-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue; throw "Setup: Exit-Code $($p.ExitCode)" }
          $app = Join-Path $env:ProgramFiles "LightOS"
          $exe = Join-Path $app "LightOS.exe"
          if (-not (Test-Path $exe)) { throw "LightOS.exe nicht in $app" }
          $vorher = (Get-ChildItem $app -Recurse -File | Measure-Object).Count
          $bericht = Join-Path $env:RUNNER_TEMP "selbsttest_installiert.txt"
          $q = Start-Process -FilePath $exe -ArgumentList "--selbsttest", "`"$bericht`"" -Wait -PassThru
          if (Test-Path $bericht) { Get-Content $bericht } else { Write-Host "kein Bericht geschrieben" }
          if ($q.ExitCode -ne 0) { throw "Selbsttest der installierten exe: Exit-Code $($q.ExitCode)" }
          $nachher = (Get-ChildItem $app -Recurse -File | Measure-Object).Count
          if ($nachher -ne $vorher) { throw "Im Programmordner sind Dateien entstanden ($vorher -> $nachher)" }
          $u = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Deinstaller: Exit-Code $($u.ExitCode)" }
          Write-Host "Installieren, Selbsttest und Deinstallieren ok."

      - name: Artefakt LightOS-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: LightOS-Setup-${{ steps.version.outputs.version }}
          path: dist/setup/LightOS-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Berichte bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-berichte
          path: |
            ${{ runner.temp }}/selbsttest_*.txt
            ${{ runner.temp }}/setup_install.log
            build/LightOS/warn-LightOS.txt
          if-no-files-found: ignore
