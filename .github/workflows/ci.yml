name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # XPLAT-CI-LINUX: Linux ist seit dem Umzug Entwicklungs- und Alltagsplattform
  # und README/INSTALL nennen es ausdruecklich unterstuetzt — geprueft hat das
  # bisher aber keine Automatik, nur lokale Laeufe auf genau einem Rechner.
  #
  # Diese Leg faehrt bewusst die VOLLE Suite segmentiert (ein Prozess je
  # Testdatei, XPLAT-11), nicht die handverlesene Liste des Windows-x64-Smokes.
  # Den segmentierten Runner gibt es seit XPLAT-WIN auch fuer Windows
  # (tools/verify_segmented.ps1); in der CI faehrt ihn bisher nur die NICHT
  # blockierende ARM64-Leg (`windows-arm`, XPLAT-41). Blockierend ist die volle
  # Suite damit nur hier — der Linux-Job ist der breiteste.
  #
  # NICHT `pytest tests/` aufrufen: die Suite in EINEM Prozess stirbt auf Linux
  # reproduzierbar an akkumulierendem nativem Qt-Zustand (XPLAT-11). verify_loop.sh
  # delegiert automatisch an tools/verify_segmented.sh.
  linux:
    name: Linux — volle Suite (segmentiert)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PROC-19: der Test-Merge UND seine beiden Eltern — sonst laesst sich
          # nicht sagen, was der PR gegenueber main aendert.
          fetch-depth: 2

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PROC-19: aendert der PR NUR Doku? Dann unten der kurze Weg. Der Schritt
      # laeuft nur im Pull-Request — bei einem Push bleibt die Ausgabe leer, und
      # leer heisst volle Suite.
      - name: Aenderungsklasse bestimmen (PROC-19)
        id: klasse
        if: github.event_name == 'pull_request'
        env:
          PR_KOPF_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/geaenderte_dateien_klasse.py --ci

      # Systempakete wie in INSTALL.md. build-essential + libasound2-dev sind fuer
      # python-rtmidi Pflicht (C-Extension) — ohne die gibt es auf Linux GAR KEIN
      # MIDI, und der rtmidi-Zweig in midi_manager.py bliebe in CI ungetestet.
      # Der Rest ist Qt-/QtWebEngine-Laufzeit fuer den offscreen-View-Smoke.
      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libasound2-dev libpulse0 \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 \
            libnss3 libnspr4 libxdamage1 libxrandr2 libxcomposite1 \
            libxcursor1 libxi6 libxtst6 libgbm1 libdrm2 libxshmfence1 \
            libgl1-mesa-dri libglx-mesa0 xvfb \
            fonts-noto fonts-dejavu

      # Bewusst ein echtes venv/ statt System-Python: tools/verify_loop.sh sucht
      # genau danach (venv/bin/python). So laeuft in CI derselbe Runner wie lokal,
      # statt eines CI-Sonderwegs, der auseinanderdriften kann — das war die Lehre
      # aus XPLAT-11.
      - name: venv + Abhaengigkeiten
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -r requirements-dev.txt

      - name: MIDI-Backend gegenpruefen
        run: |
          venv/bin/python -c "import rtmidi; print('python-rtmidi OK', rtmidi.__file__)"

      # LIGHTOS_VERIFY_JOBS an die Runner-Kerne: ubuntu-latest hat 4, wie der
      # Entwicklungsrechner. verify_loop.sh setzt QT_QPA_PLATFORM und die
      # Exit-Haertung selbst.
      #
      # ★ QTWEBENGINE_CHROMIUM_FLAGS ist hier PFLICHT, nicht Kosmetik. Der erste
      # Anlauf dieser Leg war rot: ~40 Visualizer-Tests scheiterten mit
      # "Timeout beim Warten auf window.__lightosAppReady". Ursache war nicht der
      # Code, sondern die Umgebung — ein GitHub-Runner hat keine GPU, und die
      # Three.js-Szene braucht einen WebGL-Kontext. Ohne SwiftShader kommt der
      # Renderer nie hoch, und der Fehler sieht aus wie ein Timing-Problem der App.
      #
      # Die Tests bauen ihren QWebEngineView DIREKT und laufen NICHT ueber
      # main.py — die dortige Flag-Logik (_webengine_sandbox_flags, XPLAT-01)
      # greift hier also nicht. Darum die Flags als Job-Env, inklusive der
      # Linux-Sandbox-Flags, die main.py sonst beisteuert.
      - name: Volle Suite (segmentiert)
        if: steps.klasse.outputs.klasse != 'doku'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox --disable-gpu-sandbox --disable-dev-shm-usage
            --disable-gpu --enable-unsafe-swiftshader
            --use-gl=angle --use-angle=swiftshader --in-process-gpu
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # ★★ PROC-04: dieselbe Exit-Haertung wie die Windows-Leg (dort steht
          # sie seit XPLAT-14). `conftest.py::pytest_unconfigure` beendet den
          # Prozess NACH der Session-Auswertung per `os._exit(exitstatus)` und
          # ueberspringt damit die native Abbauphase, in der der QApplication-
          # Teardown sporadisch mit SIGSEGV stirbt.
          #
          # Ohne diese Variable greift auf Linux nur der ENGE Weg: `armed and
          # LIGHTOS_HARDEN_EXIT`, und `armed` wird ausschliesslich fuer
          # WebEngine-Module gesetzt. Ein gewoehnlicher Qt-View-Test wie
          # `test_simple_desk_tint.py` faellt also durch — sein Segment stirbt
          # mit `exit 139`, waehrend die Liste der fehlgeschlagenen Tests LEER
          # bleibt, und der Lauf wird faelschlich rot. Die Docstring von
          # `pytest_unconfigure` nennt genau diesen Fall samt "Linux: SIGSEGV";
          # nur die Gegenmassnahme kam nie hier an.
          #
          # Maskiert KEINE Failures: `exitstatus` traegt das echte Ergebnis, 0
          # nur wenn ALLE Tests bestanden haben. Was sie kostet, ist die
          # Erkennung ECHTER Teardown-Abstuerze in der CI — die bleibt dem
          # lokalen Gate erhalten, das den engen Weg weiterfaehrt, und genau
          # dort wurde XPLAT-09 auch gefunden.
          LIGHTOS_HARDEN_EXIT_ALL: "1"
        run: |
          nproc
          # xvfb: QT_QPA_PLATFORM=offscreen setzt verify_loop.sh selbst, aber der
          # Chromium-Unterprozess von QtWebEngine will auf Linux trotzdem ein
          # DISPLAY sehen. Kostet nichts, wenn es nicht gebraucht wird.
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            env LIGHTOS_VERIFY_JOBS=3 ./tools/verify_loop.sh

      # PROC-19: der kurze Weg fuer reine Doku-/Backlog-PRs. Statt der vollen
      # Suite nur die Gates aus tools/doku_gates.txt — segmentiert, mit
      # derselben Umgebung wie oben (ein paar davon bauen echte Views bzw. die
      # 3D-Szene). tests/test_proc19_doku_schnellweg.py haelt fest, dass die
      # Umgebung beider Schritte gleich bleibt.
      - name: "Doku-PR: nur Doku-Gates (PROC-19)"
        if: steps.klasse.outputs.klasse == 'doku'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox --disable-gpu-sandbox --disable-dev-shm-usage
            --disable-gpu --enable-unsafe-swiftshader
            --use-gl=angle --use-angle=swiftshader --in-process-gpu
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          LIGHTOS_HARDEN_EXIT_ALL: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            env LIGHTOS_VERIFY_JOBS=3 ./tools/verify_loop.sh --doku

      - name: Segment-Logs bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-segment-logs
          path: .pytest_segments/
          retention-days: 7
          # ★ `.pytest_segments` faengt mit einem PUNKT an, und upload-artifact
          # ueberspringt versteckte Dateien seit v4.4 standardmaessig. Der
          # Schritt lief deshalb bei JEDEM roten Lauf und lud NICHTS hoch —
          # sichtbar nur an einer Zeile mitten im Log ("No files were found
          # with the provided path"). Genau die Segment-Logs, die einen
          # `exit 139` ohne FAILED-Zeile erklaeren koennten, waren damit nie
          # da. Eine Absicherung, die stillschweigend nicht greift, ist
          # schlimmer als keine (PROC-02b).
          include-hidden-files: true
          # Und nicht mehr schweigen, wenn wirklich nichts da ist: `ignore`
          # macht denselben Zustand unsichtbar, der uns hierher gebracht hat.
          if-no-files-found: warn

  test:
    name: Windows-Smoke (Python ${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PROC-19: der Test-Merge UND seine beiden Eltern — sonst laesst sich
          # nicht sagen, was der PR gegenueber main aendert.
          fetch-depth: 2

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PROC-19: aendert der PR NUR Doku? Dann unten der kurze Weg. Der Schritt
      # laeuft nur im Pull-Request — bei einem Push bleibt die Ausgabe leer, und
      # leer heisst volle Suite.
      - name: Aenderungsklasse bestimmen (PROC-19)
        id: klasse
        if: github.event_name == 'pull_request'
        env:
          PR_KOPF_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/geaenderte_dateien_klasse.py --ci

      # PROC-19: die Doku-Gates faehrt die Linux-Leg; hier gibt es fuer einen
      # reinen Doku-PR nichts zu pruefen. Der Job endet gruen unter demselben
      # Namen, damit tools/pr_bereit.py seine Checks unveraendert findet.
      - name: "Doku-PR: Kurzweg, keine Tests (PROC-19)"
        if: steps.klasse.outputs.klasse == 'doku'
        run: echo "Reiner Doku-PR - die Doku-Gates faehrt die Linux-Leg."

      # Kern-Pakete + PySide6 (offscreen) fuer den headless View-Smoke (QA-11):
      # test_views.py baut echte Qt-Views (VC/SimpleDesk/EFX/Matrix), damit eine
      # kaputte committete View auch auf GitHub auffaellt (nicht nur lokal).
      - name: Kern-Abhaengigkeiten installieren
        if: steps.klasse.outputs.klasse != 'doku'
        run: |
          python -m pip install --upgrade pip
          # pytest-timeout: ohne das Plugin sind die timeout-Keys aus pytest.ini
          # wirkungslos -> der Watchdog ist in CI still deaktiviert und ein
          # haengender Test blockiert den Lauf bis zum Job-Timeout (QA-01).
          # requirements-dev.txt bringt pytest + pytest-timeout + hypothesis;
          # OHNE hypothesis skippt test_render_contract_props.py still (QA-14 nie
          # in CI ausgefuehrt) -> ueber die Dev-Deps mitinstallieren (CDX-05).
          pip install -r requirements-dev.txt
          pip install SQLAlchemy>=2.0.0 numpy>=1.26.0 mido>=1.3.0 pyserial>=3.5
          # PySide6 (+ Addons, wie requirements.txt) fuer den View-Smoke.
          pip install "PySide6>=6.7.0" "PySide6-Addons>=6.7.0"

      # QA-11: zusaetzlich Show-Lint (kaputte committete Show) + View-Smoke.
      # Ein absichtlich kaputter param_key in einer Test-Show bzw. eine nicht mehr
      # baubare View laesst CI jetzt rot werden.
      #
      # EINZIGER Testschritt (bewusst): test_views.py baut echte Qt-Views (+ MIDI-
      # Threads); der FINALE native Interpreter-Exit crasht auf Windows/Py3.11/
      # PySide6 6.11 sporadisch mit STATUS_HEAP_CORRUPTION (0xc0000374) NACH
      # bestandenen Tests. LIGHTOS_HARDEN_EXIT_ALL laesst conftest.py nach dem
      # echten Ergebnis mit os._exit(exitstatus) beenden und ueberspringt so die
      # flaky native Abbauphase (maskiert NICHTS: exitstatus=0 nur, wenn alle Tests
      # bestehen). Frueher gab es dahinter noch einen zweiten, IDENTISCHEN
      # "Zusammenfassen"-Lauf derselben 5 Dateien — reine Redundanz ohne Mehr-
      # Abdeckung, die den Teardown-Crash nur ein zweites Mal wuerfelte und CI
      # zuverlaessig rot faerbte (traf #294/#296). Entfernt -> ein Lauf genuegt.
      #
      # XPLAT-40: dazu die SANDBOX-Tests des Bild-Werkzeugs. Die Undichtigkeit
      # unter Windows (USERPROFILE/LOCALAPPDATA, XPLAT-39) war auf Linux nicht
      # zu sehen, weil Linux HOME liest — nur hier faellt ein Rueckfall auf.
      # Bewusst NUR WindowsHomeTest + SandboxRiegelTest, nicht die ganze Datei:
      # MiniLaufTest baut im Unterprozess ein VOLLES MainWindow und rendert eine
      # PNG (Schrift-/Groessenpruefung), und dieser Job installiert nur die
      # Kernpakete (kein rtmidi/soundcard/Flask). Die volle Datei faehrt das
      # lokale Windows-Gate. tests/test_ci_windows_legs.py haelt die Liste fest.
      - name: Unit-Tests ausfuehren
        if: steps.klasse.outputs.klasse != 'doku'
        env:
          QT_QPA_PLATFORM: offscreen
          LIGHTOS_HARDEN_EXIT_ALL: "1"
        run: |
          python -m pytest tests/test_show_file.py tests/test_core_engine.py tests/test_show_lint.py tests/test_render_contract_props.py tests/test_views.py tests/test_anleitungsbilder.py::WindowsHomeTest tests/test_anleitungsbilder.py::SandboxRiegelTest -v --tb=short

  # XPLAT-41: Windows auf ARM64 (Snapdragon) — requirements.txt verspricht das,
  # geprueft hat es bisher keine Automatik. Die Leg faehrt die VOLLE Suite mit
  # dem segmentierten Windows-Runner auf einem echten ARM-Runner.
  #
  # ★ XPLAT-45 (02.10.2026): die Suite laeuft mit x64-Python UNTER EMULATION,
  # nicht mehr mit nativem ARM64-Python. Gemessen, nicht vermutet: mit
  # `architecture: arm64` war die Leg flaechig rot (630/780 Segmente, 88 rot,
  # 61 Crashes) — die win_arm64-Wheels von PySide6-Addons (6.11.2, 35,8 MB statt
  # ~150 MB fuer win_amd64) enthalten KEIN QtWebEngine, und rund 90 Testdateien
  # importieren den Visualizer. Der echte ARM-Rechner (Rig-PC, Snapdragon,
  # Windows 11) laeuft genau deshalb mit x64-Python: nur so gibt es dort den
  # 3D-Visualizer. Die Leg prueft jetzt diese reale Konfiguration. Natives
  # ARM64 bleibt als eigener Befund-Schritt im Log (welche Qt-Module die Wheels
  # mitbringen) — sobald QtWebEngine dort auftaucht, meldet der Schritt das.
  #
  # ★ ZUNAECHST NICHT BLOCKIEREND (continue-on-error). Auswertung nach einer
  # Woche Laeufen (BACKLOG XPLAT-41/XPLAT-45): gruen genug -> scharf schalten
  # (continue-on-error raus, tests/test_ci_windows_legs.py anpassen, Eintrag
  # aus tools/_ci_beobachtend.py nehmen), sonst die Befunde als eigene Items.
  #
  # Abhaengigkeiten wie in der Linux-Leg ins venv/ (verify_segmented.ps1 sucht
  # genau venv\Scripts\python.exe) und VOLL aus requirements*.txt — nicht die
  # Kernauswahl des x64-Smokes: die volle Suite importiert Flask, python-osc,
  # soundcard usw. python-rtmidi (C-Extension) und die optionalen winrt-Pakete
  # (MIDI 2.0) kommen in einen EIGENEN Schritt, damit ein fehlgeschlagener Bau
  # die Leg nicht vor dem ersten Test beendet.
  windows-arm:
    name: Windows-ARM64 — volle Suite (segmentiert, beobachtend)
    runs-on: windows-11-arm
    timeout-minutes: 120
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PROC-19: der Test-Merge UND seine beiden Eltern — sonst laesst sich
          # nicht sagen, was der PR gegenueber main aendert.
          fetch-depth: 2

      # XPLAT-45: ZUERST das native ARM64-Python, nur fuer den Befund. Die
      # zweite setup-python-Stufe unten legt danach x64 vorne in den PATH.
      - name: Python 3.14 (natives ARM64, nur Befund) einrichten
        id: py_arm64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: arm64

      # PROC-19: aendert der PR NUR Doku? Dann unten der kurze Weg. Der Schritt
      # laeuft nur im Pull-Request — bei einem Push bleibt die Ausgabe leer, und
      # leer heisst volle Suite.
      - name: Aenderungsklasse bestimmen (PROC-19)
        id: klasse
        if: github.event_name == 'pull_request'
        env:
          PR_KOPF_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/geaenderte_dateien_klasse.py --ci

      - name: "Doku-PR: Kurzweg, keine Tests (PROC-19)"
        if: steps.klasse.outputs.klasse == 'doku'
        run: echo "Reiner Doku-PR - die Doku-Gates faehrt die Linux-Leg."

      - name: Natives ARM64 — Qt-Module der Wheels (Befund, darf scheitern)
        if: steps.klasse.outputs.klasse != 'doku'
        shell: pwsh
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vpy = "$env:RUNNER_TEMP\venv-arm64\Scripts\python.exe"
          & "${{ steps.py_arm64.outputs.python-path }}" -m venv "$env:RUNNER_TEMP\venv-arm64"
          & $vpy -m pip install --upgrade pip
          & $vpy -m pip install "PySide6>=6.7.0" "PySide6-Addons>=6.7.0"
          & $vpy tools/qt_module_befund.py

      # 3.14 gibt es fuer win32-x64 und win32-arm64 im Manifest von
      # actions/python-versions; x64 laeuft auf windows-11-arm per Emulation.
      - name: Python 3.14 (x64 unter Emulation, wie am Rig) einrichten
        if: steps.klasse.outputs.klasse != 'doku'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip

      - name: venv + Abhaengigkeiten (ohne native Optionale)
        if: steps.klasse.outputs.klasse != 'doku'
        shell: pwsh
        run: |
          # Ohne das bricht pwsh bei einem fehlgeschlagenen pip NICHT ab, und
          # der Schritt waere gruen, solange nur der LETZTE Befehl klappt.
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import platform, sys, sysconfig; print(sys.version); print('Maschine:', platform.machine(), 'Interpreter:', sysconfig.get_platform())"
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          # python-rtmidi + winrt herausfiltern -> eigener Schritt unten.
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*(python-rtmidi|winrt-)' } |
            Set-Content -Encoding utf8 "$env:RUNNER_TEMP\requirements-kern.txt"
          venv\Scripts\python.exe -m pip install -r "$env:RUNNER_TEMP\requirements-kern.txt"
          venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: python-rtmidi + winrt (darf scheitern)
        if: steps.klasse.outputs.klasse != 'doku'
        shell: pwsh
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Get-Content requirements.txt | Where-Object { $_ -match '^\s*(python-rtmidi|winrt-)' } |
            Set-Content -Encoding utf8 "$env:RUNNER_TEMP\requirements-nativ.txt"
          venv\Scripts\python.exe -m pip install -r "$env:RUNNER_TEMP\requirements-nativ.txt"
          venv\Scripts\python.exe -c "import rtmidi; print('python-rtmidi OK', rtmidi.__file__)"

      - name: Qt-Module des Suite-venv (QtWebEngine erwartet)
        if: steps.klasse.outputs.klasse != 'doku'
        shell: pwsh
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          venv\Scripts\python.exe tools/qt_module_befund.py --erwarte-webengine

      # LIGHTOS_HARDEN_EXIT_ALL wie in den anderen Legs (PROC-04): os._exit nach
      # dem echten Ergebnis, ueberspringt den flaky nativen Abbau. Maskiert
      # keine Failures. QT_QPA_PLATFORM=offscreen setzt das Skript selbst.
      # -j 4: der Parameter heisst -Jobs (Alias -j), windows-11-arm hat 4 Kerne.
      - name: Volle Suite (segmentiert)
        if: steps.klasse.outputs.klasse != 'doku'
        shell: pwsh
        env:
          LIGHTOS_HARDEN_EXIT_ALL: "1"
          # XPLAT-45: der Runner hat keine GPU — ohne Software-WebGL (ANGLE/
          # SwiftShader) wird keine 3D-Szene bereit (CI-Lauf zu #891: 32 rote
          # Segmente, alle „Szene wurde nicht bereit"). Wie in der Linux-Leg.
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --disable-gpu-sandbox --enable-unsafe-swiftshader
            --use-gl=angle --use-angle=swiftshader --in-process-gpu
        run: |
          pwsh tools/verify_segmented.ps1 -j 4

      - name: Segment-Logs bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm-segment-logs
          path: .pytest_segments/
          retention-days: 7
          # Versteckter Pfad -> ohne das laedt v4.4+ NICHTS hoch (PROC-02b).
          include-hidden-files: true
          if-no-files-found: warn
