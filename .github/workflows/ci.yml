name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # XPLAT-CI-LINUX: Linux ist seit dem Umzug Entwicklungs- und Alltagsplattform
  # und README/INSTALL nennen es ausdruecklich unterstuetzt — geprueft hat das
  # bisher aber keine Automatik, nur lokale Laeufe auf genau einem Rechner.
  #
  # Diese Leg faehrt bewusst die VOLLE Suite, nicht die 5 Smoke-Dateien des
  # Windows-Jobs: auf Linux gibt es dafuer den segmentierten Runner (ein Prozess
  # je Testdatei, XPLAT-11), und genau der ist auf Windows nicht verfuegbar. Der
  # Linux-Job ist damit der breitere von beiden.
  #
  # NICHT `pytest tests/` aufrufen: die Suite in EINEM Prozess stirbt auf Linux
  # reproduzierbar an akkumulierendem nativem Qt-Zustand (XPLAT-11). verify_loop.sh
  # delegiert automatisch an tools/verify_segmented.sh.
  linux:
    name: Linux — volle Suite (segmentiert)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Systempakete wie in INSTALL.md. build-essential + libasound2-dev sind fuer
      # python-rtmidi Pflicht (C-Extension) — ohne die gibt es auf Linux GAR KEIN
      # MIDI, und der rtmidi-Zweig in midi_manager.py bliebe in CI ungetestet.
      # Der Rest ist Qt-/QtWebEngine-Laufzeit fuer den offscreen-View-Smoke.
      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libasound2-dev libpulse0 \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1 \
            libnss3 libnspr4 libxdamage1 libxrandr2 libxcomposite1 \
            libxcursor1 libxi6 libxtst6 libgbm1 libdrm2 libxshmfence1 \
            libgl1-mesa-dri libglx-mesa0 xvfb \
            fonts-noto fonts-dejavu

      # Bewusst ein echtes venv/ statt System-Python: tools/verify_loop.sh sucht
      # genau danach (venv/bin/python). So laeuft in CI derselbe Runner wie lokal,
      # statt eines CI-Sonderwegs, der auseinanderdriften kann — das war die Lehre
      # aus XPLAT-11.
      - name: venv + Abhaengigkeiten
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python -m pip install -r requirements-dev.txt

      - name: MIDI-Backend gegenpruefen
        run: |
          venv/bin/python -c "import rtmidi; print('python-rtmidi OK', rtmidi.__file__)"

      # LIGHTOS_VERIFY_JOBS an die Runner-Kerne: ubuntu-latest hat 4, wie der
      # Entwicklungsrechner. verify_loop.sh setzt QT_QPA_PLATFORM und die
      # Exit-Haertung selbst.
      #
      # ★ QTWEBENGINE_CHROMIUM_FLAGS ist hier PFLICHT, nicht Kosmetik. Der erste
      # Anlauf dieser Leg war rot: ~40 Visualizer-Tests scheiterten mit
      # "Timeout beim Warten auf window.__lightosAppReady". Ursache war nicht der
      # Code, sondern die Umgebung — ein GitHub-Runner hat keine GPU, und die
      # Three.js-Szene braucht einen WebGL-Kontext. Ohne SwiftShader kommt der
      # Renderer nie hoch, und der Fehler sieht aus wie ein Timing-Problem der App.
      #
      # Die Tests bauen ihren QWebEngineView DIREKT und laufen NICHT ueber
      # main.py — die dortige Flag-Logik (_webengine_sandbox_flags, XPLAT-01)
      # greift hier also nicht. Darum die Flags als Job-Env, inklusive der
      # Linux-Sandbox-Flags, die main.py sonst beisteuert.
      - name: Volle Suite (segmentiert)
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: >-
            --no-sandbox --disable-gpu-sandbox --disable-dev-shm-usage
            --disable-gpu --enable-unsafe-swiftshader
            --use-gl=angle --use-angle=swiftshader --in-process-gpu
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          # ★★ PROC-04: dieselbe Exit-Haertung wie die Windows-Leg (dort steht
          # sie seit XPLAT-14). `conftest.py::pytest_unconfigure` beendet den
          # Prozess NACH der Session-Auswertung per `os._exit(exitstatus)` und
          # ueberspringt damit die native Abbauphase, in der der QApplication-
          # Teardown sporadisch mit SIGSEGV stirbt.
          #
          # Ohne diese Variable greift auf Linux nur der ENGE Weg: `armed and
          # LIGHTOS_HARDEN_EXIT`, und `armed` wird ausschliesslich fuer
          # WebEngine-Module gesetzt. Ein gewoehnlicher Qt-View-Test wie
          # `test_simple_desk_tint.py` faellt also durch — sein Segment stirbt
          # mit `exit 139`, waehrend die Liste der fehlgeschlagenen Tests LEER
          # bleibt, und der Lauf wird faelschlich rot. Die Docstring von
          # `pytest_unconfigure` nennt genau diesen Fall samt "Linux: SIGSEGV";
          # nur die Gegenmassnahme kam nie hier an.
          #
          # Maskiert KEINE Failures: `exitstatus` traegt das echte Ergebnis, 0
          # nur wenn ALLE Tests bestanden haben. Was sie kostet, ist die
          # Erkennung ECHTER Teardown-Abstuerze in der CI — die bleibt dem
          # lokalen Gate erhalten, das den engen Weg weiterfaehrt, und genau
          # dort wurde XPLAT-09 auch gefunden.
          LIGHTOS_HARDEN_EXIT_ALL: "1"
        run: |
          nproc
          # xvfb: QT_QPA_PLATFORM=offscreen setzt verify_loop.sh selbst, aber der
          # Chromium-Unterprozess von QtWebEngine will auf Linux trotzdem ein
          # DISPLAY sehen. Kostet nichts, wenn es nicht gebraucht wird.
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            env LIGHTOS_VERIFY_JOBS=3 ./tools/verify_loop.sh

      - name: Segment-Logs bei Fehlschlag hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-segment-logs
          path: .pytest_segments/
          retention-days: 7
          # ★ `.pytest_segments` faengt mit einem PUNKT an, und upload-artifact
          # ueberspringt versteckte Dateien seit v4.4 standardmaessig. Der
          # Schritt lief deshalb bei JEDEM roten Lauf und lud NICHTS hoch —
          # sichtbar nur an einer Zeile mitten im Log ("No files were found
          # with the provided path"). Genau die Segment-Logs, die einen
          # `exit 139` ohne FAILED-Zeile erklaeren koennten, waren damit nie
          # da. Eine Absicherung, die stillschweigend nicht greift, ist
          # schlimmer als keine (PROC-02b).
          include-hidden-files: true
          # Und nicht mehr schweigen, wenn wirklich nichts da ist: `ignore`
          # macht denselben Zustand unsichtbar, der uns hierher gebracht hat.
          if-no-files-found: warn

  test:
    name: Windows-Smoke (Python ${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Kern-Pakete + PySide6 (offscreen) fuer den headless View-Smoke (QA-11):
      # test_views.py baut echte Qt-Views (VC/SimpleDesk/EFX/Matrix), damit eine
      # kaputte committete View auch auf GitHub auffaellt (nicht nur lokal).
      - name: Kern-Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # pytest-timeout: ohne das Plugin sind die timeout-Keys aus pytest.ini
          # wirkungslos -> der Watchdog ist in CI still deaktiviert und ein
          # haengender Test blockiert den Lauf bis zum Job-Timeout (QA-01).
          # requirements-dev.txt bringt pytest + pytest-timeout + hypothesis;
          # OHNE hypothesis skippt test_render_contract_props.py still (QA-14 nie
          # in CI ausgefuehrt) -> ueber die Dev-Deps mitinstallieren (CDX-05).
          pip install -r requirements-dev.txt
          pip install SQLAlchemy>=2.0.0 numpy>=1.26.0 mido>=1.3.0 pyserial>=3.5
          # PySide6 (+ Addons, wie requirements.txt) fuer den View-Smoke.
          pip install "PySide6>=6.7.0" "PySide6-Addons>=6.7.0"

      # QA-11: zusaetzlich Show-Lint (kaputte committete Show) + View-Smoke.
      # Ein absichtlich kaputter param_key in einer Test-Show bzw. eine nicht mehr
      # baubare View laesst CI jetzt rot werden.
      #
      # EINZIGER Testschritt (bewusst): test_views.py baut echte Qt-Views (+ MIDI-
      # Threads); der FINALE native Interpreter-Exit crasht auf Windows/Py3.11/
      # PySide6 6.11 sporadisch mit STATUS_HEAP_CORRUPTION (0xc0000374) NACH
      # bestandenen Tests. LIGHTOS_HARDEN_EXIT_ALL laesst conftest.py nach dem
      # echten Ergebnis mit os._exit(exitstatus) beenden und ueberspringt so die
      # flaky native Abbauphase (maskiert NICHTS: exitstatus=0 nur, wenn alle Tests
      # bestehen). Frueher gab es dahinter noch einen zweiten, IDENTISCHEN
      # "Zusammenfassen"-Lauf derselben 5 Dateien — reine Redundanz ohne Mehr-
      # Abdeckung, die den Teardown-Crash nur ein zweites Mal wuerfelte und CI
      # zuverlaessig rot faerbte (traf #294/#296). Entfernt -> ein Lauf genuegt.
      - name: Unit-Tests ausfuehren
        env:
          QT_QPA_PLATFORM: offscreen
          LIGHTOS_HARDEN_EXIT_ALL: "1"
        run: |
          python -m pytest tests/test_show_file.py tests/test_core_engine.py tests/test_show_lint.py tests/test_render_contract_props.py tests/test_views.py -v --tb=short
