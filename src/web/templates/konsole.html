<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LightOS">
<meta name="format-detection" content="telephone=no">
<title>LightOS Handy-Konsole</title>
<!-- WEB-11: „Zum Startbildschirm hinzufügen". Das Manifest trägt keinen
     Schlüssel; Symbole liegen lokal. Bewusst KEIN Service Worker: der bräuchte
     HTTPS, und ohne Verbindung zum Pult hat die Seite nichts zu zeigen. -->
<link rel="manifest" href="{{ url_for('konsole_manifest') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon-180.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/konsole-192.png') }}">
<!-- WEB-09: Handy-Konsole. Alles lokal: keine Schriften, Bilder oder Skripte
     von ausserhalb, die Seite muss am Veranstaltungsort ohne Internet laufen. -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1117;overflow:hidden;overscroll-behavior:none}
body{position:fixed;top:0;right:0;bottom:0;left:0;color:#e6edf3;
  font-family:-apple-system,'Segoe UI',Roboto,'DejaVu Sans',Arial,sans-serif;font-size:14px;line-height:1.2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#app{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Kopf */
#kopf{flex:0 0 44px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 12px;gap:10px}
#kopf .logo{color:#58a6ff;font-weight:700;font-size:16px}
#kopf .titel{flex:1;min-width:0;color:#c3ccd5;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#kopf a{color:#8b949e;font-size:12px;text-decoration:none;padding:10px 4px}
#verb{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;color:#f85149}
#verb:before{content:'';width:9px;height:9px;border-radius:50%;background:#f85149}
#verb.an{color:#3fb950}
#verb.an:before{background:#3fb950;box-shadow:0 0 6px #3fb950}

/* Seiten-Reiter */
#reiter{flex:0 0 auto;display:none;background:#12161c;border-bottom:1px solid #30363d;overflow:hidden}
#reiter.mehrere{display:flex}
#reiter button{flex:1;min-width:0;height:40px;background:none;border:none;color:#8b949e;font:inherit;font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;border-bottom:3px solid transparent}
#reiter button.an{color:#58a6ff;border-bottom-color:#58a6ff}

/* Raster */
#buehne{flex:1;min-height:0;position:relative}
.seite{position:absolute;top:0;right:0;bottom:0;left:0;display:none;gap:7px;padding:9px;
  grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr))}
.seite.an{display:grid}
.zelle{min-width:0;min-height:0;position:relative;border-radius:10px;touch-action:none}
.leer{border:1px dashed #262c35;background:rgba(22,27,34,.35)}

/* Taste */
.taste{background:linear-gradient(#2b323c,#1f252d);border:1px solid #3a424d;border-bottom:4px solid #12161b;color:#e6edf3;
  font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  overflow:hidden;padding:2px 4px}
.taste .streifen{width:24px;height:6px;border-radius:3px;margin-bottom:5px;background:var(--farbe,#58a6ff);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.taste .name{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.taste small{font-size:10px;font-weight:400;color:#9aa4af;margin-top:2px}
.taste .punkt{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#3d444d}
.taste.aktiv{background:var(--farbe,#1f6feb);border-color:var(--rand,#79b8ff);border-bottom-color:rgba(0,0,0,.55);
  color:var(--text,#fff);box-shadow:0 0 14px var(--schein,rgba(88,166,255,.55))}
.taste.aktiv .streifen{background:var(--text,#fff);opacity:.85}
.taste.aktiv small{color:var(--text,#fff);opacity:.8}
.taste.aktiv .punkt{background:#fff;box-shadow:0 0 6px #fff}
.taste.finger{transform:translateY(2px);border-bottom-width:2px;filter:brightness(1.25)}
.taste.blackout{background:#050607;border:2px solid #da3633;border-bottom:4px solid #6b1917;color:#ff5b55;font-size:18px;letter-spacing:1.5px}
.taste.blackout .streifen{display:none}
.taste.blackout.aktiv{background:#da3633;color:#fff;box-shadow:0 0 16px rgba(218,54,51,.7)}
.taste.notaus{background:linear-gradient(#b3312e,#8e2421);border-color:#f0625d;border-bottom-color:#4f1210;color:#fff}
.taste.notaus .streifen{display:none}
/* WEB-12: Laser ohne Freigabe gesperrt, verlorenes Ziel (QA96-19) */
.zelle.gesperrt{opacity:.55;filter:grayscale(.6)}
.zelle .schloss,.zelle .warntext{display:block;flex:0 0 auto;max-width:100%;text-align:center;font-size:10px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;margin-top:2px;pointer-events:none;letter-spacing:0}
.zelle .schloss{color:#f2cc60}
.zelle .warntext{color:#ff7b72}
.zelle .schloss:empty,.zelle .warntext:empty{display:none}
.zelle.ziel_fehlt{border:2px dashed #ff5555 !important;box-shadow:none !important}
.zelle.ziel_fehlt.aktiv{background:linear-gradient(#2b323c,#1f252d) !important;color:#e6edf3 !important}
.zelle.ziel_fehlt small,.zelle.ziel_fehlt .punkt,.zelle.gesperrt .punkt{display:none}
.zelle .warn{position:absolute;top:3px;right:6px;color:#ff5555;font-size:13px;font-weight:700;pointer-events:none}
/* WEB-12 (QA96-37): Laser-NOT-AUS am Pult aktiv */
#notaus{flex:0 0 auto;display:none;background:#8e2421;border-bottom:2px solid #f0625d;color:#fff;font-weight:700;font-size:14px;
  text-align:center;padding:8px 10px;letter-spacing:.5px}
#notaus.an{display:block}
#notaus small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}

/* WEB-13: ganze Kachel in der Farbe der VC-Taste. Aus = gedimmt (Farbe mit
   dunklem Grund gemischt), an = volle Farbe mit Schein. Die Farben rechnet
   kachelFarben() aus; Textfarbe aus der Helligkeit (Kontrast). */
.taste.gefaerbt{background:linear-gradient(var(--aus-oben),var(--aus-unten));border-color:var(--aus-rand);
  border-bottom-color:rgba(0,0,0,.55);color:var(--aus-text)}
.taste.gefaerbt .streifen{display:none}
.taste.gefaerbt small,.taste.gefaerbt .pult{color:var(--aus-text);opacity:.75}
.taste.gefaerbt.aktiv{background:linear-gradient(var(--an-oben),var(--an-unten));border-color:var(--rand);
  color:var(--an-text);box-shadow:0 0 14px var(--schein)}
.taste.gefaerbt.aktiv small,.taste.gefaerbt.aktiv .pult{color:var(--an-text);opacity:.85}
.taste .symbol{font-size:17px;line-height:1;margin-bottom:3px}
.taste .symbol:empty{display:none}
.taste .pult{display:block;max-width:100%;font-size:9px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.taste .pult:empty{display:none}
.zelle .marke{position:absolute;top:4px;left:5px;font-size:9px;font-weight:700;line-height:1.2;background:rgba(13,17,23,.82);
  color:#f2cc60;border-radius:4px;padding:1px 4px;pointer-events:none;letter-spacing:0}
.taste .bpm{position:absolute;bottom:3px;right:6px;font-size:9px;font-weight:700;opacity:.9;pointer-events:none}
.taste .bpm:empty{display:none}
/* WEB-13: Effekt-Dynamik — nur solange die Taste aktiv ist, rein per CSS.
   Verlauf: die Effektfarben laufen durch die Kachel. Takt: Blinken im BPM. */
.taste.gefaerbt.aktiv.lauf{background:var(--verlauf);background-size:300% 100%;color:#fff;
  animation:lauf var(--lauf-dauer,3s) linear infinite}
.taste.lauf .name,.taste.lauf .symbol{text-shadow:0 1px 3px rgba(0,0,0,.85)}
.taste.gefaerbt.aktiv.takt{animation:takt var(--takt-dauer,.5s) steps(1) infinite}
.taste.gefaerbt.aktiv.lauf.takt{animation:lauf var(--lauf-dauer,3s) linear infinite,takt var(--takt-dauer,.5s) steps(1) infinite}
@keyframes lauf{from{background-position:0 0}to{background-position:300% 0}}
@keyframes takt{0%{filter:brightness(1.35)}50%{filter:brightness(.6)}}
/* Schalter „Animationen am Handy“ aus (body.ruhig) oder System will keine
   Bewegung: der Verlauf steht still, nichts blinkt. */
body.ruhig .taste.lauf,body.ruhig .taste.takt{animation:none !important}
@media (prefers-reduced-motion: reduce){ .taste.lauf,.taste.takt{animation:none !important} }
#anim{flex:0 0 auto;height:30px;border-radius:15px;border:1px solid #3a424d;background:#21262d;color:#c3ccd5;font:inherit;
  font-size:11px;font-weight:700;padding:0 9px;white-space:nowrap;touch-action:manipulation}
#anim[aria-checked="false"]{color:#6e7681;border-style:dashed}

/* WEB-14: Gruppen. Rahmen und Titel liegen als eigene Rasterfelder ÜBER den
   Kacheln (pointer-events:none) – sie belegen keine Zelle, die Anordnung der
   Seite bleibt, wie sie am Pult gebaut wurde. */
.gruppe{position:relative;pointer-events:none;z-index:3;border-radius:13px;margin:-4px}
.gruppe.einzel{border:2px solid #58a6ff;box-shadow:0 0 0 1px rgba(13,17,23,.6)}
.gruppe.handy{border:2px dashed #f2cc60;margin:-6px;border-radius:15px}
.gruppe.einzeln{margin:-3px}
.gruppe.handy.einzeln{margin:-5px}
.gruppe .titel{position:absolute;top:-8px;left:8px;max-width:calc(100% - 16px);font-size:10px;line-height:13px;font-weight:700;
  padding:0 5px;border-radius:6px;background:#0d1117;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gruppe.einzel .titel{color:#79b8ff}
.gruppe.handy .titel{color:#f2cc60;top:auto;bottom:-8px}

/* Fader */
.fader{background:#11161c;border:1px solid #30363d;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;overflow:hidden}
.fader .wert{font-size:13px;font-weight:700;color:#58a6ff;flex:0 0 auto}
.fader .bahn{flex:1;min-height:0;width:14px;border-radius:7px;background:#05070a;border:1px solid #2a3038;margin:14px 0 14px;position:relative}
.fader .fuell{position:absolute;left:0;right:0;bottom:0;border-radius:6px;background:linear-gradient(#58a6ff,#1f6feb)}
.fader .griff{position:absolute;left:-18px;width:48px;height:24px;margin-bottom:-12px;border-radius:5px;
  background:linear-gradient(#e6edf3,#9aa4af);border:1px solid #fff;box-shadow:0 3px 6px rgba(0,0,0,.7)}
.fader .griff:after{content:'';position:absolute;left:6px;right:6px;top:10px;height:2px;background:#30363d}
.fader .name{font-size:11px;font-weight:700;color:#c3ccd5;max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.fader.finger{border-color:#58a6ff}
.fader.gm{border-color:#d29922;background:#1a160b}
.fader.gm .wert,.fader.gm .name{color:#f2cc60}
.fader.gm .fuell{background:linear-gradient(#f2cc60,#d29922)}
/* Fader, der quer liegt (breiter als hoch): Bahn waagerecht */
.fader.quer{flex-direction:row;padding:0 10px;gap:10px}
.fader.quer .bahn{height:14px;width:auto;flex:1;margin:0 14px}
.fader.quer .fuell{top:0;bottom:0;right:auto}
.fader.quer .griff{left:auto;top:-18px;width:24px;height:48px;margin:0 0 0 -12px}
.fader.quer .griff:after{left:10px;right:auto;top:6px;bottom:6px;width:2px;height:auto}
.fader.quer .wert{width:44px;text-align:right}

/* Cueliste */
.cueliste{background:#111820;border:1px solid #2b5d9e;display:flex;flex-direction:column;padding:6px;gap:6px;overflow:hidden}
.cueliste .anzeige{flex:1 1 0;min-height:0;padding:0 6px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.cueliste .z1{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.cueliste .z1 span:first-child{overflow:hidden;text-overflow:ellipsis}
.cueliste .jetzt{font-size:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cueliste .jetzt em{font-style:normal;color:#58a6ff;margin-right:7px}
.cueliste .danach{font-size:12px;color:#9aa4af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cueliste .balken{height:3px;border-radius:2px;background:#21262d;margin-top:5px;overflow:hidden}
.cueliste .balken i{display:block;height:100%;width:0;background:#58a6ff}
.cueliste .knoepfe{flex:1.25 1 0;min-height:44px;display:flex;gap:7px}
.cueliste.flach .anzeige .danach,.cueliste.flach .balken{display:none}
.kn{flex:1;min-width:0;border-radius:10px;border:1px solid #3a424d;border-bottom:4px solid #12161b;background:linear-gradient(#2b323c,#1f252d);
  color:#e6edf3;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;touch-action:none}
.kn.go{flex:2;background:linear-gradient(#2f81f7,#1a5fd0);border-color:#79b8ff;border-bottom-color:#0f3a82;color:#fff;font-size:24px}
.kn.stop{background:linear-gradient(#b3312e,#8e2421);border-color:#f0625d;border-bottom-color:#4f1210;color:#fff}
.kn.finger{transform:translateY(2px);border-bottom-width:2px;filter:brightness(1.25)}

/* Feste Leiste unten: Grand Master + Blackout */
#leiste{flex:0 0 auto;background:#161b22;border-top:1px solid #30363d;padding:8px 9px 9px;display:flex;gap:8px;height:74px}
#gm{flex:1.6;min-width:0;border-radius:10px;touch-action:none}
#bo{flex:1;min-width:0;border-radius:10px;background:#050607;border:2px solid #da3633;border-bottom:4px solid #6b1917;color:#ff5b55;
  font:inherit;font-weight:700;font-size:16px;letter-spacing:1.2px;touch-action:none}
#bo.aktiv{background:#da3633;color:#fff;box-shadow:0 0 16px rgba(218,54,51,.7)}
#bo.finger{filter:brightness(1.3)}

/* Hinweise / Sperre */
#hinweis{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:28px;gap:10px;color:#c3ccd5;font-size:15px;line-height:1.45}
#hinweis.an{display:flex}
#hinweis b{font-size:19px;color:#e6edf3}
#hinweis small{font-size:13px;color:#8b949e}
#sperre{position:absolute;top:calc(44px + env(safe-area-inset-top, 0px));right:0;bottom:0;left:0;display:none;align-items:center;justify-content:center;
  background:rgba(7,9,13,.72);z-index:20;touch-action:none}
#sperre.an{display:flex}
#sperre div{background:#161b22;border:1px solid #da3633;border-radius:12px;padding:16px 22px;text-align:center;font-weight:700;color:#ff7b72;
  box-shadow:0 10px 30px rgba(0,0,0,.7)}
#sperre small{display:block;font-weight:400;color:#9aa4af;margin-top:5px;font-size:12px}
#meldung{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:#3b1717;border:1px solid #7d2a27;color:#ffb3ad;
  border-radius:16px;padding:7px 14px;font-size:13px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
#meldung.an{opacity:1}

/* WEB-11: Schlüssel eintippen, wenn die Seite ohne gültige Anmeldung startet */
#hinweis form{display:flex;gap:8px;margin-top:6px;width:100%;max-width:300px}
#hinweis input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid #3a424d;background:#0d1117;color:#e6edf3;
  font:inherit;font-size:16px;padding:0 12px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#hinweis input:focus{outline:none;border-color:#58a6ff}
#hinweis form button{height:44px;border-radius:10px;border:1px solid #79b8ff;background:#1f6feb;color:#fff;font:inherit;font-weight:700;
  padding:0 14px;touch-action:manipulation}

/* WEB-11: Tipp „Zum Startbildschirm hinzufügen" — dezent, wegklickbar */
#tipp{flex:0 0 auto;display:none;align-items:center;gap:10px;background:#12161c;border-top:1px solid #30363d;color:#9aa4af;
  font-size:12px;line-height:1.35;padding:7px 6px 7px 12px}
#tipp.an{display:flex}
#tipp .text{flex:1;min-width:0}
#tipp b{color:#c3ccd5}
#tipp button{flex:0 0 auto;width:40px;height:40px;background:none;border:none;color:#8b949e;font:inherit;font-size:20px;
  touch-action:manipulation}

@media (max-height:560px){ #kopf{flex-basis:34px}#sperre{top:calc(34px + env(safe-area-inset-top, 0px))}#tipp{display:none !important}#reiter button{height:32px}#leiste{height:60px;padding:5px 9px 6px}
  .seite{gap:5px;padding:6px}}
</style>
</head>
<body>
<div id="app">
  <div id="kopf">
    <span class="logo">LightOS</span>
    <span class="titel" id="titel">Handy-Konsole</span>
    <button id="anim" type="button" role="switch" aria-checked="true" title="Animationen am Handy">✦ Anim. an</button>
    {# WEB-12: die feste Fernbedienung nur verlinken, wenn diese Sitzung sie oeffnen darf #}
    {% if feste_seite %}<a href="/" id="zurueck">‹ Remote</a>{% endif %}
    <span id="verb">getrennt</span>
  </div>
  <div id="notaus" role="alert">LASER NOT-AUS AKTIV<small>Laser sind dunkel und unscharf – lösen nur am Pult</small></div>
  <div id="reiter"></div>
  <div id="buehne">
    <div id="hinweis" class="an"><b>Verbinde …</b></div>
  </div>
  <div id="tipp" role="note">
    <span class="text" id="tipp_text"></span>
    <button type="button" id="tipp_zu" aria-label="Tipp schließen">×</button>
  </div>
  <div id="leiste">
    <div id="gm" class="zelle fader gm quer"><span class="name">Master</span><div class="bahn"><i class="fuell"></i><b class="griff"></b></div><span class="wert">–</span></div>
    <button id="bo" type="button">BLACKOUT</button>
  </div>
  <div id="sperre"><div>Getrennt<small>Bedienung gesperrt – verbinde neu …</small></div></div>
  <div id="meldung"></div>
</div>

<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>
<script>
(function () {
'use strict';

var FEHLERTEXT = {
  nur_am_pult: 'Nur am Pult möglich',
  nicht_freigegeben: 'Nicht für das Handy freigegeben',
  abgeschaltet: 'Handy-Konsole ist ausgeschaltet',
  unbekannte_kennung: 'Element gibt es nicht mehr',
  typ_nicht_erlaubt: 'Element ist nicht fernbedienbar',
  keine_konsole: 'Keine Konsole in LightOS geöffnet',
  zeitueberschreitung: 'LightOS antwortet nicht',
  kein_zugang: 'Kein Zugang – Link mit Schlüssel neu öffnen',
  laser_gesperrt: 'Laser – nur mit Freigabe am Pult',
  blackout_nicht_von_hier: 'Blackout kam nicht von diesem Handy – aufheben am Pult',
  gruppe_blockiert: 'Andere Taste der Gruppe ist gehalten oder gesperrt',
  kein_recht: 'Nicht erlaubt',
  wert_ungueltig: 'Ungültiger Wert'
};

var $ = function (id) { return document.getElementById(id); };
var buehne = $('buehne'), reiter = $('reiter'), hinweis = $('hinweis');

var stand = null;          // letzter vollständiger Stand vom Pult
var rev = 0;               // Nummer der letzten verarbeiteten Meldung
var hoechsteRev = 0;       // höchste Nummer, die seit dem Verbinden ankam
var verbunden = false;
var keinZugang = false;    // Schlüssel fehlt oder gilt nicht mehr
var seiteNr = 0;
var ansichten = {};        // Kennung -> Liste von {el, setze(w)}
var inHand = {};           // Kennung -> Zeitpunkt der letzten eigenen Bewegung
var gmInHand = 0;
var aktiveFinger = [];     // Abbruch-Funktionen laufender Berührungen
var zaehler = 0;
var seitenEls = [];        // WEB-14: Seiten-Elemente in Reihenfolge (für die Gruppen-Rahmen)

/* ── Verbindung ─────────────────────────────────────────────────────── */

var socket = (typeof io === 'function') ? io({reconnectionDelay: 500, reconnectionDelayMax: 2000}) : null;

function setzeVerbunden(an) {
  verbunden = an;
  $('verb').className = an ? 'an' : '';
  $('verb').textContent = an ? 'verbunden' : (keinZugang ? 'kein Zugang' : 'getrennt');

/* ── Farben ─────────────────────────────────────────────────────────── */

function farbe(hex) {
  var m = /^#([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) { return null; }
  var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  // Sehr dunkle Widget-Farben aufhellen: am Handy muss „an" leuchten.
  var hell = Math.max(r, g, b);
  if (hell < 180) {
    var f = hell < 8 ? 0 : 180 / hell;
    if (f === 0) { r = 88; g = 166; b = 255; } else { r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f); }
  }
  var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return {
    rgb: [r, g, b],
    voll: 'rgb(' + r + ',' + g + ',' + b + ')',
    rand: 'rgb(' + Math.min(255, r + 70) + ',' + Math.min(255, g + 70) + ',' + Math.min(255, b + 70) + ')',
    schein: 'rgba(' + r + ',' + g + ',' + b + ',.6)',
    text: lum > 0.6 ? '#10141a' : '#ffffff'
  };
}

/* WEB13-FARBEN-ANFANG — reine Rechnungen (auch im Test mit node geprüft) */

function rgbVon(hex) {
  var m = /^#([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) { return null; }
  var n = parseInt(m[1], 16);

}
function rgbText(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
// ``anteil`` von a, Rest von b
function mische(a, b, anteil) {
  return [0, 1, 2].map(function (i) { return Math.round(a[i] * anteil + b[i] * (1 - anteil)); });
}
// relative Leuchtdichte nach WCAG
function leuchtdichte(c) {
  var l = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
}
function kontrast(a, b) {

}

// Die lesbarere der beiden Textfarben auf dem Grund ``c``.
function textFuer(c) { return kontrast(c, HELL) >= kontrast(c, DUNKEL) ? '#ffffff' : '#10141a'; }

// Alle Farben einer Kachel aus der Tastenfarbe: aus = gedimmt, an = voll.
function kachelFarben(hex) {
  var f = farbe(hex);
  if (!f) { return null; }
  var c = f.rgb;
  var ausOben = mische(c, [31, 37, 45], 0.38), ausUnten = mische(c, [21, 26, 32], 0.22);
  var anUnten = mische(c, [0, 0, 0], 0.7);
  return {
    aus: {oben: rgbText(ausOben), unten: rgbText(ausUnten), text: textFuer(mische(ausOben, ausUnten, 0.5)),
          rand: rgbText(mische(c, [58, 66, 77], 0.45))},
    an: {oben: rgbText(c), unten: rgbText(anUnten), text: textFuer(mische(c, anUnten, 0.5))},
    rand: f.rand, schein: f.schein

}

// Effekt-Dynamik einer aktiven Taste -> CSS: Verlauf und Taktdauer.
function effektStil(effekt) {
  var raus = {lauf: false, takt: false, verlauf: '', laufDauer: '', taktDauer: '', bpm: 0};
  if (!effekt) { return raus; }
  var farben = (effekt.farben || []).filter(function (h) { return !!rgbVon(h); }).slice(0, 8);
  if (farben.length >= 2) {
    raus.lauf = true;
    raus.verlauf = 'linear-gradient(90deg,' + farben.concat([farben[0]]).join(',') + ')';
    raus.laufDauer = Math.max(2, farben.length) + 's';
  }
  if (effekt.takt) {
    var bpm = Number(effekt.bpm);
    if (!isFinite(bpm) || bpm <= 0) { bpm = 120; }
    bpm = Math.max(30, Math.min(300, Math.round(bpm)));

    raus.bpm = bpm;
    raus.taktDauer = (Math.round(60000 / bpm) / 1000) + 's';   // ein Schlag = einmal hell, einmal dunkel

// Feste Warnkacheln: nie umgefärbt, nie animiert, keine eigene Handy-Beschriftung.
function festesAussehen(w) {
  return !w || w.funktion === 'Blackout' || w.funktion === 'LaserEstop' ||
    w.gesperrt === 'laser' || (w.ziel_fehlt || []).length > 0;

var MERK_ANIM = 'lightos_konsole_anim';

/* ── Berührung ──────────────────────────────────────────────────────── */

// Eine Berührung auf einem Element verfolgen. ``unten`` darf false liefern
// (nichts tun). Jede begonnene Berührung endet garantiert mit ``oben`` —
// auch bei Abbruch durch das System oder Verbindungsverlust.
function finger(el, unten, zieh, oben) {
  el.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (!verbunden || el._finger !== undefined) { return; }
    if (unten(ev) === false) { return; }
    el._finger = ev.pointerId;
    try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    el.classList.add('finger');
    if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    var fertig = false;
    function ende(evt) {
      if (evt && evt.pointerId !== undefined && evt.pointerId !== el._finger) { return; }
      if (fertig) { return; }
      fertig = true;
      el._finger = undefined;
      el.classList.remove('finger');
      el.removeEventListener('pointermove', bewegt);
      el.removeEventListener('pointerup', ende);
      el.removeEventListener('pointercancel', ende);
      el.removeEventListener('lostpointercapture', ende);
      var i = aktiveFinger.indexOf(ende);
      if (i >= 0) { aktiveFinger.splice(i, 1); }

    function bewegt(evt) {
      if (evt.pointerId !== el._finger) { return; }
      evt.preventDefault();
      if (zieh) { zieh(evt); }

    el.addEventListener('pointerup', ende);
    el.addEventListener('pointercancel', ende);

// Beginnt die Beschriftung mit einem Symbol (Emoji/Zeichen), steht es groß
// über dem Namen — wie auf der VC-Taste, die es in der Beschriftung trägt.
function trenneSymbol(text) {
  var m = /^\s*(\S+)\s+(\S[\s\S]*)$/.exec(text || '');
  if (m && m[1].length <= 4 && !/[0-9A-Za-zÀ-ɏ]/.test(m[1]) &&
      !/^[\-–—.,:;!?()\[\]„“"'«»+*\/#&%=<>|~_]+$/.test(m[1])) {
    return {symbol: m[1], name: m[2]};

}

function baueTaste(w, el, eintrag) {

  var symbol = document.createElement('span'); symbol.className = 'symbol';
  var name = document.createElement('span'); name.className = 'name';
  var pult = document.createElement('span'); pult.className = 'pult';
  var klein = document.createElement('small');

  var marke = document.createElement('span'); marke.className = 'marke'; marke.textContent = 'Handy';
  var bpm = document.createElement('span'); bpm.className = 'bpm';
  el.appendChild(streifen); el.appendChild(symbol); el.appendChild(name); el.appendChild(pult);
  el.appendChild(klein); el.appendChild(punkt); el.appendChild(bpm);
  var aktuell = w;

      el.style.setProperty('--text', k.an.text);
      el.style.setProperty('--aus-oben', k.aus.oben);
      el.style.setProperty('--aus-unten', k.aus.unten);
      el.style.setProperty('--aus-text', k.aus.text);
      el.style.setProperty('--aus-rand', k.aus.rand);
      el.style.setProperty('--an-oben', k.an.oben);
      el.style.setProperty('--an-unten', k.an.unten);

// Fader-Bedienung für ein Element mit .bahn/.fuell/.griff/.wert.

function faderBedienung(el, lies, schreibe, darf) {

    } else {
      fuell.style.height = p + '%'; fuell.style.width = '';
      griff.style.bottom = p + '%'; griff.style.left = '';
    }
    wertEl.textContent = Math.round(p) + '%';
  }
  function schicke(v, sofort) {
    if (v === zuletztGesendet) { return; }
    var jetzt = Date.now();
    if (!sofort && jetzt - letzter < 33) {       // höchstens ~30 Werte je Sekunde
      offen = v;
      return;
    }
    letzter = jetzt; offen = null; zuletztGesendet = v;
    schreibe(v);
  }
  finger(el, function (ev) {
    if (darf && darf() === false) { return false; }
    var r = bahn.getBoundingClientRect();
    start = {x: ev.clientX, y: ev.clientY, wert: lies(), weg: Math.max(40, quer() ? el.getBoundingClientRect().width : r.height)};
    zuletztGesendet = -1;
  }, function (ev) {
    var d = quer() ? (ev.clientX - start.x) : (start.y - ev.clientY);
    var v = Math.max(0, Math.min(255, Math.round(start.wert + d / start.weg * 255)));
    zeige(v);
    el._wert = v;
    schicke(v, false);
  }, function () {
    if (offen !== null) { schicke(offen, true); }
    start = null;
  });
  return zeige;
}

function baueFader(w, el, eintrag) {
  var eigenText = (eintrag && eintrag.handy_text) || '';
  el.className += ' fader';
  if (w.modus && /grand/i.test(w.modus)) { el.className += ' gm'; }
  el.innerHTML = '<span class="wert"></span><div class="bahn"><i class="fuell"></i><b class="griff"></b></div><span class="name"></span>';
  var aktuell = w;
  var zeige = faderBedienung(el, function () { return el._wert !== undefined ? el._wert : aktuell.wert; },
    function (v) { inHand[aktuell.id] = Date.now(); aktion(aktuell.id, 'setzen', v); },
    function () { if (aktuell.gesperrt) { melde(FEHLERTEXT.laser_gesperrt); return false; } });
  return function (neu) {
    aktuell = neu;
    var t = !festesAussehen(neu) && eigenText ? eigenText : (neu.beschriftung || '');
    el.querySelector('.name').textContent = t;
    // Während der Finger zieht (und kurz danach) gewinnt die eigene Hand –
    // die Rückmeldung des eigenen Werts ließe den Griff sonst zurückspringen.
    if (el._finger !== undefined || Date.now() - (inHand[neu.id] || 0) < 400) { return; }
    el._wert = neu.wert;
    zeige(neu.wert);
  };
}

function knopf(text, klasse, tun) {
  var b = document.createElement('div');
  b.className = 'kn ' + klasse;
  b.textContent = text;
  finger(b, tun, null, null);
  return b;
}

function baueCueliste(w, el, hoehe, eintrag) {
  var eigenText = (eintrag && eintrag.handy_text) || '';
  el.className += ' cueliste' + (hoehe < 3 ? ' flach' : '');
  var anzeige = document.createElement('div'); anzeige.className = 'anzeige';
  anzeige.innerHTML = '<div class="z1"><span></span><span></span></div><div class="jetzt"></div><div class="danach"></div><div class="balken"><i></i></div>';
  var knoepfe = document.createElement('div'); knoepfe.className = 'knoepfe';
  var aktuell = w;
  function frei(was) { if (aktuell.gesperrt) { melde(FEHLERTEXT.laser_gesperrt); return false; } return aktion(aktuell.id, was); }
  knoepfe.appendChild(knopf('GO', 'go', function () { return frei('go'); }));
  knoepfe.appendChild(knopf('BACK', 'back', function () { return frei('back'); }));
  knoepfe.appendChild(knopf('STOP', 'stop', function () { return aktion(aktuell.id, 'stop'); }));
  if (hoehe >= 2) { el.appendChild(anzeige); }
  el.appendChild(knoepfe);
  function nr(n) { return (Math.round(n * 100) / 100).toString().replace('.', ','); }
  return function (neu) {
    aktuell = neu;
    var z = anzeige.querySelectorAll('.z1 span');
    var laeuft = neu.cue_index >= 0;
    var titel = !festesAussehen(neu) && eigenText ? eigenText : (neu.liste || neu.beschriftung || 'Cueliste');
    z[0].textContent = titel + (neu.liste ? (laeuft ? ' · läuft' : ' · bereit') : ' · keine Liste');
    z[1].textContent = neu.anzahl ? (Math.max(0, neu.cue_index + 1) + ' / ' + neu.anzahl) : '';
    var jetzt = anzeige.querySelector('.jetzt');
    jetzt.innerHTML = '';
    if (neu.cue) {
      var em = document.createElement('em'); em.textContent = nr(neu.cue.nummer); jetzt.appendChild(em);
      jetzt.appendChild(document.createTextNode(neu.cue.name || 'Cue'));
    } else {
      jetzt.appendChild(document.createTextNode(neu.liste ? '—' : ''));
    }
    anzeige.querySelector('.danach').textContent = neu.naechste ? ('danach: ' + nr(neu.naechste.nummer) + ' · ' + (neu.naechste.name || 'Cue')) : (neu.liste ? 'danach: –' : '');
    anzeige.querySelector('.balken i').style.width = neu.anzahl ? (Math.max(0, neu.cue_index + 1) / neu.anzahl * 100) + '%' : '0';
  };
}

/* ── WEB-12: Sperre und verlorenes Ziel ─────────────────────────────── */

// Zeigt an jedem Element, was das Pult weiss: gesperrt (Laser ohne Freigabe)
// oder Ziel verloren (Funktion gelöscht, Blackout-Ziel weg). Ein Element mit
// verlorenem Ziel leuchtet nicht „aktiv“ — es schaltet ja nichts.
function mitZustand(el, setze) {
  var schloss = null, warn = null, warntext = null;
  return function (w) {
    setze(w);
    var gesperrt = w.gesperrt === 'laser';
    el.classList.toggle('gesperrt', gesperrt);
    if (gesperrt && !schloss) { schloss = document.createElement('span'); schloss.className = 'schloss'; el.appendChild(schloss); }
    if (schloss) { schloss.textContent = gesperrt ? '🔒 Laser – Freigabe am Pult' : ''; }
    var fehlt = (w.ziel_fehlt || []).length > 0;
    el.classList.toggle('ziel_fehlt', fehlt);
    if (fehlt && !warn) {
      warn = document.createElement('span'); warn.className = 'warn'; warn.textContent = '⚠'; el.appendChild(warn);
      warntext = document.createElement('span'); warntext.className = 'warntext'; el.appendChild(warntext);
    }
    if (warn) { warn.style.display = fehlt ? '' : 'none'; warntext.textContent = fehlt ? w.ziel_fehlt[0] : ''; }
  };
}

/* ── Aufbau ─────────────────────────────────────────────────────────── */

function uebernehmeWidget(w) {
  if (!w || !stand) { return; }
  var vorher = stand.widgets[w.id];
  stand.widgets[w.id] = w;
  (ansichten[w.id] || []).forEach(function (a) { a(w); });
  // WEB-14: Rahmen mit Einzel-Auswahl am Pult umgestellt -> Gruppen neu zeichnen.
  if (einzelSchluessel(vorher) !== einzelSchluessel(w)) { zeichneGruppen(); }
}

/* ── WEB-14: Gruppen sichtbar machen ────────────────────────────────── */

function einzelSchluessel(w) { return (w && w.typ === 'taste' && w.einzel) ? (w.einzel.id + '\u0001' + (w.einzel.titel || '')) : ''; }

// Alle Gruppen einer Seite: Rahmen mit Einzel-Auswahl (blau, vom Pult) und
// eigene Handy-Gruppen (gelb gestrichelt). Nur Kacheln, die als Taste da sind.
function gruppenDerSeite(eintraege) {
  var raus = [], einzel = {};
  eintraege.forEach(function (e) {
    var w = stand.widgets[e.widget];
    if (!w || w.typ !== 'taste' || !w.einzel) { return; }
    var g = einzel[w.einzel.id];
    if (!g) { g = einzel[w.einzel.id] = {art: 'einzel', titel: (w.einzel.titel || 'Rahmen') + ' (immer nur eine)', eintraege: []}; raus.push(g); }
    g.eintraege.push(e);
  });
  (stand.gruppen || []).forEach(function (gr) {
    var drin = eintraege.filter(function (e) { return gr.widgets.indexOf(e.widget) >= 0 && stand.widgets[e.widget]; });
    if (drin.length) { raus.push({art: 'handy', titel: (gr.name || 'Gruppe') + ' (nur Handy)', eintraege: drin}); }
  });
  return raus.filter(function (g) { return g.eintraege.length >= (g.art === 'einzel' ? 2 : 1); });
}

// Ein gemeinsamer Kasten nur, wenn im umschließenden Rechteck KEINE fremde
// Kachel liegt – sonst umrahmte er eine Taste, die nicht dazugehört. Dann
// bekommt jede Kachel ihre eigene Markierung in derselben Farbe, der Titel
// steht an der ersten. So bleibt das Raster immer, wie es gebaut wurde.
function gruppenFelder(g, eintraege) {
  var s0 = 99, z0 = 99, s1 = -1, z1 = -1;
  g.eintraege.forEach(function (e) {
    s0 = Math.min(s0, e.spalte); z0 = Math.min(z0, e.zeile);
    s1 = Math.max(s1, e.spalte + e.breite); z1 = Math.max(z1, e.zeile + e.hoehe);
  });
  var fremd = eintraege.some(function (e) {
    if (g.eintraege.indexOf(e) >= 0) { return false; }
    return e.spalte < s1 && e.spalte + e.breite > s0 && e.zeile < z1 && e.zeile + e.hoehe > z0;
  });
  if (!fremd) { return [{spalte: s0, zeile: z0, breite: s1 - s0, hoehe: z1 - z0, titel: true, einzeln: false}]; }
  var sortiert = g.eintraege.slice().sort(function (a, b) { return a.zeile - b.zeile || a.spalte - b.spalte; });
  return sortiert.map(function (e, i) { return {spalte: e.spalte, zeile: e.zeile, breite: e.breite, hoehe: e.hoehe, titel: i === 0, einzeln: true}; });
}

/* WEB14-GRUPPEN-ENDE */

function zeichneGruppen() {
  if (!stand) { return; }
  seitenEls.forEach(function (s) {
    var alte = s.querySelectorAll('.gruppe');
    for (var i = 0; i < alte.length; i++) { s.removeChild(alte[i]); }
    var eintraege = s._eintraege || [];
    gruppenDerSeite(eintraege).forEach(function (g) {
      gruppenFelder(g, eintraege).forEach(function (f) {
        var el = document.createElement('div');
        el.className = 'gruppe ' + g.art + (f.einzeln ? ' einzeln' : '');
        el.style.gridColumn = (f.spalte + 1) + ' / span ' + f.breite;
        el.style.gridRow = (f.zeile + 1) + ' / span ' + f.hoehe;
        el.setAttribute('aria-hidden', 'true');
        if (f.titel) { var t = document.createElement('span'); t.className = 'titel'; t.textContent = '◉ ' + g.titel; el.appendChild(t); }
        s.appendChild(el);
      });
    });
  });
}

function zeigeGm() { if (stand && $('gm')._finger === undefined && Date.now() - gmInHand > 400) { $('gm')._wert = stand.gm; gmZeige(stand.gm); } }
function zeigeBlackout() { $('bo').classList.toggle('aktiv', !!(stand && stand.blackout)); }
// WEB-12 (QA96-37): der Laser-NOT-AUS ist am Handy sichtbar.
function zeigeNotaus() { $('notaus').className = (stand && stand.notaus) ? 'an' : ''; }

function zeigeSeite(nr) {
  var seiten = buehne.querySelectorAll('.seite');
  if (!seiten.length) { return; }
  seiteNr = Math.max(0, Math.min(seiten.length - 1, nr));
  for (var i = 0; i < seiten.length; i++) { seiten[i].classList.toggle('an', i === seiteNr); }
  var knoepfe = reiter.querySelectorAll('button');
  for (var j = 0; j < knoepfe.length; j++) { knoepfe[j].classList.toggle('an', j === seiteNr); }
  $('titel').textContent = (stand.seiten[seiteNr] && stand.seiten[seiteNr].name) || 'Handy-Konsole';
  try { sessionStorage.setItem('lightos_seite', String(seiteNr)); } catch (e) {}
}

function uebernehmeAlles(k) {
  if (!k) { return; }
  stand = {seiten: k.seiten || [], widgets: k.widgets || {}, gm: k.gm, blackout: k.blackout, aktiv: !!k.aktiv,
           notaus: !!k.notaus, gruppen: k.gruppen || []};
  seitenEls = [];
  zeigeNotaus();
  rev = k.rev || 0;
  ansichten = {};
  aktiveFinger.slice().forEach(function (abbruch) { abbruch(); });
  aktiveFinger = [];
  var alte = buehne.querySelectorAll('.seite');
  for (var i = 0; i < alte.length; i++) { buehne.removeChild(alte[i]); }
  reiter.innerHTML = '';
  $('leiste').style.display = stand.aktiv ? '' : 'none';
  if (!stand.aktiv) {
    reiter.className = '';
    $('titel').textContent = 'Handy-Konsole';
    zeigeHinweis('Handy-Konsole ist ausgeschaltet', 'In LightOS einschalten: Ausgabe → Web-Remote: Verbindung & Token → „Handy-Konsole“.');
    return;
  }
  zeigeGm(); zeigeBlackout();
  if (!stand.seiten.length) {
    reiter.className = '';
    $('titel').textContent = 'Handy-Konsole';
    zeigeHinweis('Noch keine Handy-Seite', 'In LightOS: Virtuelle Konsole → „Handy-Konsole“ → Elemente hineinziehen.');
    return;
  }
  hinweis.className = '';
  stand.seiten.forEach(function (seite, nr) {
    var s = document.createElement('div');
    s.className = 'seite';
    var spalten = seite.spalten || 4, zeilen = seite.zeilen || 10;
    s.style.gridTemplateColumns = 'repeat(' + spalten + ',minmax(0,1fr))';
    s.style.gridTemplateRows = 'repeat(' + zeilen + ',minmax(0,1fr))';
    (seite.eintraege || []).forEach(function (e) {
      var el = document.createElement('div');
      el.className = 'zelle';
      el.style.gridColumn = (e.spalte + 1) + ' / span ' + e.breite;
      el.style.gridRow = (e.zeile + 1) + ' / span ' + e.hoehe;
      var w = stand.widgets[e.widget];
      if (!w) { el.className += ' leer'; s.appendChild(el); return; }   // verwaist: leeres Feld
      var setze;
      if (w.typ === 'fader') {
        if (e.breite > e.hoehe) { el.className += ' quer'; }
        setze = baueFader(w, el, e);
      } else if (w.typ === 'cueliste') {
        setze = baueCueliste(w, el, e.hoehe, e);
      } else {
        setze = baueTaste(w, el, e);
      }
      // WEB-13: Marke „Handy“ auch an Fader/Cueliste mit eigener Beschriftung.
      if (w.typ !== 'taste' && e.handy_text) {
        var mk = document.createElement('span'); mk.className = 'marke'; mk.textContent = 'Handy'; el.appendChild(mk);
      }
      setze = mitZustand(el, setze);
      setze(w);
      (ansichten[w.id] = ansichten[w.id] || []).push(setze);
      s.appendChild(el);
    });
    s._eintraege = seite.eintraege || [];
    seitenEls.push(s);
    buehne.appendChild(s);
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = seite.name || ('Seite ' + (nr + 1));
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); zeigeSeite(nr); });
    reiter.appendChild(b);
  });
  reiter.className = stand.seiten.length > 1 ? 'mehrere' : '';
  zeichneGruppen();
  var gemerkt = seiteNr;
  try { var g = parseInt(sessionStorage.getItem('lightos_seite'), 10); if (!isNaN(g)) { gemerkt = g; } } catch (e) {}
  zeigeSeite(gemerkt);
}

/* ── Feste Leiste ───────────────────────────────────────────────────── */

var gmZeige = faderBedienung($('gm'), function () { return $('gm')._wert !== undefined ? $('gm')._wert : (stand ? stand.gm : 255); },
  function (v) {
    gmInHand = Date.now(); if (stand) { stand.gm = v; }
    sende('vc_pult', {gm: v, n: ++zaehler}, function (antwort) {
      // WEB-12: abgelehnt (Laser) – der Regler springt auf den echten Wert zurück.
      if (antwort && antwort.ok === false && antwort.gm !== undefined && stand) { gmInHand = 0; stand.gm = antwort.gm; zeigeGm(); }
    });
  });

finger($('bo'), function () {
  if (!stand) { return false; }
  var an = !stand.blackout;
  return sende('vc_pult', {blackout: an}, function (antwort) {
    // WEB-12: auch eine Ablehnung traegt den echten Stand (Blackout bleibt).
    if (antwort && antwort.blackout !== undefined) { stand.blackout = antwort.blackout; zeigeBlackout(); }
  });
}, null, null);

/* ── Wischen zwischen Seiten (nur auf freier Fläche) ────────────────── */

(function () {
  var s = null;
  buehne.addEventListener('pointerdown', function (ev) {
    var z = ev.target;
    // Nur wo kein Bedienelement liegt: ein Wisch über eine Taste löst sie aus,
    // nicht den Seitenwechsel.
    if (z !== buehne && !z.classList.contains('seite') && !z.classList.contains('leer')) { s = null; return; }
    s = {x: ev.clientX, y: ev.clientY, id: ev.pointerId};
  });
  buehne.addEventListener('pointerup', function (ev) {
    if (!s || s.id !== ev.pointerId) { return; }
    var dx = ev.clientX - s.x, dy = ev.clientY - s.y;
    s = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) { zeigeSeite(seiteNr + (dx < 0 ? 1 : -1)); }
  });
})();

/* ── Kein Zoom, kein Scrollen, kein Kontextmenü ─────────────────────── */

['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dblclick', 'selectstart'].forEach(function (n) {
  document.addEventListener(n, function (ev) {
    // Das Feld für den Schlüssel bleibt ein gewöhnliches Eingabefeld.
    if (ev.target && ev.target.tagName === 'INPUT') { return; }
    ev.preventDefault();
  }, {passive: false});
});
document.addEventListener('touchmove', function (ev) { ev.preventDefault(); }, {passive: false});

// Für Tests und Fehlersuche (kein Teil der Bedienung).
window.lightosKonsole = {stand: function () { return stand; }, verbunden: function () { return verbunden; }};
})();
</script>
